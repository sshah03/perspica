[package]
name = "perspica-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories = ["development-tools", "parser-implementations"]
readme = "README.md"
# The real-PR tests read fixtures from the workspace, which the package doesn't ship.
exclude = ["tests/real_prs.rs"]
description = "Semantic diff engine: AST-aware change classification, noise detection, reading order and test reach"

[dependencies]
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-c-sharp = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-php = "0.25"
tree-sitter-ruby = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
