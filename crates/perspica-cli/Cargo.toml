[package]
# Published as `perspica`, so `cargo install perspica` works.
name = "perspica"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "Review code changes by what they do: semantic diff, noise hiding, reading order, and what you asked your coding agent for"

[[bin]]
name = "perspica"
path = "src/main.rs"

[dependencies]
perspica-core = { path = "../perspica-core", version = "0.2.1" }
clap = { version = "4", features = ["derive"] }
colored = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "process"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
rust-embed = "8"
open = "5"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
