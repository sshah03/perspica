    @media (prefers-color-scheme: dark) { .ink { stroke: #e6edf3 } .signal { stroke: #58a6ff } }
  </style>
  <g fill="none" stroke-linecap="round" transform="translate(1.4 -1)">
    <path class="ink" stroke-width="2.8" d="M7.6 13.8V28.4"/>
    <circle class="ink" stroke-width="2.8" cx="15.2" cy="13.8" r="7.6"/>
    <path class="signal" stroke-width="3" d="M11.3 13.8h7.8"/>
  </g>
</svg>
